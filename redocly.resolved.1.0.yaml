openapi: 3.0.3
info:
  title: Create Test User
  contact: {}
  version: '1.0'
servers:
  - url: https://test-api.service.hmrc.gov.uk/
    variables: {}
tags:
  - name: create-test-user
    description: ''
paths:
  /create-test-user/individuals:
    post:
      tags:
        - create-test-user
      summary: Create a test user which is an individual
      description: This resource creates and returns a test user which is an individual. The caller can specify the required service enrolments in the request body. If no request body is supplied, the test user is created with no service enrolments.  Test users that have not been tested against within a 3-month period will be automatically deleted.
      operationId: Createatestuserwhichisanindividual
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
                - $schema: http://json-schema.org/draft-04/schema#
                  description: Create Individual Request
                  type: object
                  properties:
                    serviceNames:
                      type: array
                      description: A list of services that the user should be enrolled for. To create a test user with no services, leave the list empty.
                      minItems: 0
                      items:
                        type: string
                        oneOf:
                          - title: national-insurance
                            enum:
                              - national-insurance
                            description: Generates a National Insurance number and enrols the user for National Insurance.
                          - title: self-assessment
                            enum:
                              - self-assessment
                            description: Generates a Self Assessment UTR and enrols the user for Self Assessment.
                          - title: mtd-income-tax
                            enum:
                              - mtd-income-tax
                            description: Generates a National Insurance number and a Making Tax Digital Income Tax ID and enrols the user for Making Tax Digital Income Tax.
                          - title: customs-services
                            enum:
                              - customs-services
                            description: Generates an EORI number and enrols the user for Customs Services.
                          - title: goods-vehicle-movements
                            enum:
                              - goods-vehicle-movements
                            description: Generates an EORI number and enrols the user for Goods Vehicle Movements.
                          - title: import-control-system
                            enum:
                              - import-control-system
                            description: Generates an EORI number and enrols the user for Import Control System.
                          - title: mtd-vat
                            enum:
                              - mtd-vat
                            description: Generates a VAT Registration Number and a date of registration for VAT and enrols the user for Making Tax Digital VAT.
                          - title: common-transit-convention-traders
                            enum:
                              - common-transit-convention-traders
                            description: Generates an EORI number and enrols the user for Common Transit Convention Traders.
                          - title: common-transit-convention-traders-legacy
                            enum:
                              - common-transit-convention-traders-legacy
                            description: Generates an EORI number and enrols the user for legacy Common Transit Convention Traders.
                      uniqueItems: true
                    eoriNumber:
                      type: string
                      description: Economic Operator Registration and Identification (EORI) number. Regular expressions:<br><code>^(GB|XI)[0-9]{12,15}$</code> A GB or XI EORI.<br><code>^[A-Z]{2}[0-9]{1,15}$</code> An EU EORI.
                      minLength: 3
                      maxLength: 17
                    nino:
                      type: string
                      description: National Insurance number. Must be enrolled with 'national-insurance' or 'mtd-income-tax' services for this to be used.
                  required:
                    - serviceNames
      responses:
        '201':
          description: The individual test user resource has been created.
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $schema: http://json-schema.org/draft-04/schema#
                    description: Create Individual Response
                    type: object
                    properties:
                      userId:
                        type: string
                        description: Government Gateway ID.
                      password:
                        type: string
                        description: Government Gateway password.
                      userFullName:
                        type: string
                        description: Government Gateway user's full name.
                      emailAddress:
                        type: string
                        description: Government Gateway user's email address.
                      individualDetails:
                        type: object
                        properties:
                          firstName:
                            type: string
                            description: Individual's first name.
                          lastName:
                            type: string
                            description: Individual's last name.
                          dateOfBirth:
                            type: string
                            format: date
                            description: Individual's date of birth.
                          address:
                            type: object
                            properties:
                              line1:
                                type: string
                                description: Individual's first line of address.
                              line2:
                                type: string
                                description: Individual's second line of address.
                              postcode:
                                type: string
                                description: Individual's postcode.
                            required:
                              - line1
                              - line2
                              - postcode
                        required:
                          - firstName
                          - lastName
                          - dateOfBirth
                          - address
                      saUtr:
                        type: string
                        description: Self Assessment UTR.
                      nino:
                        type: string
                        description: National Insurance number.
                      mtdItId:
                        type: string
                        description: Making Tax Digital Income Tax ID.
                      eoriNumber:
                        type: string
                        description: Economic Operator Registration and Identification (EORI) number.
                      vrn:
                        type: string
                        description: VAT Reference Number.
                      vatRegistrationDate:
                        type: string
                        format: date
                        description: Date of registration for VAT.
                    required:
                      - userId
                      - password
                      - userFullName
                      - emailAddress
                      - individualDetails
      security:
        - applicationRestricted: []
      deprecated: false
  /create-test-user/organisations:
    post:
      tags:
        - create-test-user
      summary: Create a test user which is an organisation
      description: This resource creates and returns a test user which is an organisation. The caller can specify the required service enrolments in the request body. If no request body is supplied, the test user is created with no service enrolments.  Test users that have not been tested against within a 3-month period will be automatically deleted.
      operationId: Createatestuserwhichisanorganisation
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
                - $schema: http://json-schema.org/draft-04/schema#
                  description: Create Organisation Request
                  type: object
                  properties:
                    serviceNames:
                      type: array
                      description: A list of services that the user should be enrolled for. To create a test user with no services, leave the list empty.
                      minItems: 0
                      items:
                        type: string
                        oneOf:
                          - title: corporation-tax
                            enum:
                              - corporation-tax
                            description: Generates a Corporation Tax Unique Taxpayer Reference (CTUTR), a Company Registration Number (CRN) and enrols the user for Corporation Tax.
                          - title: paye-for-employers
                            enum:
                              - paye-for-employers
                            description: Generates an Employer Reference and enrols the user for PAYE for Employers.
                          - title: submit-vat-returns
                            enum:
                              - submit-vat-returns
                            description: Generates a VAT Registration Number and enrols the user for Submit VAT Returns.
                          - title: national-insurance
                            enum:
                              - national-insurance
                            description: Generates a National Insurance number and enrols the user for National Insurance.
                          - title: self-assessment
                            enum:
                              - self-assessment
                            description: Generates a Self Assessment UTR and enrols the user for Self Assessment.
                          - title: mtd-income-tax
                            enum:
                              - mtd-income-tax
                            description: Generates a National Insurance number and a Making Tax Digital Income Tax ID and enrols the user for Making Tax Digital Income Tax.
                          - title: mtd-vat
                            enum:
                              - mtd-vat
                            description: Generates a VAT Registration Number and a date of registration for VAT and enrols the user for Making Tax Digital VAT.
                          - title: lisa
                            enum:
                              - lisa
                            description: Generates a LISA Manager Reference Number and enrols the user for Lifetime ISA.
                          - title: secure-electronic-transfer
                            enum:
                              - secure-electronic-transfer
                            description: Generates a Secure Electronic Transfer Reference Number and enrols the user for HMRC Secure Electronic Transfer.
                          - title: relief-at-source
                            enum:
                              - relief-at-source
                            description: Generates a Pension Scheme Administrator Identifier and enrols the user for Relief at Source.
                          - title: customs-services
                            enum:
                              - customs-services
                            description: Generates an EORI number and enrols the user for Customs Services.
                          - title: goods-vehicle-movements
                            enum:
                              - goods-vehicle-movements
                            description: Generates an EORI number and enrols the user for Goods Vehicle Movements.
                          - title: import-control-system
                            enum:
                              - import-control-system
                            description: Generates an EORI number and enrols the user for Import Control System.
                          - title: safety-and-security
                            enum:
                              - safety-and-security
                            description: Generates an EORI number and enrols the user for Safety and Security.
                          - title: common-transit-convention-traders
                            enum:
                              - common-transit-convention-traders
                            description: Generates an EORI number and enrols the user for Common Transit Convention Traders.
                          - title: common-transit-convention-traders-legacy
                            enum:
                              - common-transit-convention-traders-legacy
                            description: Generates an EORI number and enrols the user for legacy Common Transit Convention Traders.
                          - title: excise-movement-control-system
                            enum:
                              - excise-movement-control-system
                            description: Generates an Excise Number and enrols the user for Excise Movement Control System.
                          - title: modernisation-of-authorisations
                            enum:
                              - modernisation-of-authorisations
                            description: Generates an EORI number and enrols the user for Modernisation of Authorisations.
                          - title: pillar-2
                            enum:
                              - pillar-2
                            description: Generates a Pillar 2 ID and enrols the user for Pillar 2.
                          - title: disa
                            enum:
                              - disa
                            description: Generates an ISA Manager Z Reference and enrols the user for DISA.
                      uniqueItems: true
                    eoriNumber:
                      type: string
                      description: Economic Operator Registration and Identification (EORI) number. Regular expressions:<br><code>^(GB|XI)[0-9]{12,15}$</code> A GB or XI EORI.<br><code>^[A-Z]{2}[0-9]{1,15}$</code> An EU EORI.
                      minLength: 3
                      maxLength: 17
                    exciseNumber:
                      type: string
                      description: Excise Number. Must be enrolled with 'excise-movement-control-system' for this to be used
                      minLength: 13
                      maxLength: 13
                      pattern: ^[A-Z]{2}[a-zA-Z0-9]{11}$
                    nino:
                      type: string
                      description: National Insurance number. Must be enrolled with 'national-insurance' or 'mtd-income-tax' services for this to be used.
                    taxPayerType:
                      type: string
                      description: Type of Self Assessment taxpayer One of 'Individual' or 'Partnership'
                    pillar2Id:
                      type: string
                      description: A Pillar 2 ID can be provided for the test organisation
                    zReference:
                      type: string
                      description: An ISA Manager Z Reference can be provided for the test organisation
                  required:
                    - serviceNames
      responses:
        '201':
          description: The organisation test user resource has been created.
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $schema: http://json-schema.org/draft-04/schema#
                    description: Create Organisation Response
                    type: object
                    properties:
                      userId:
                        type: string
                        description: Government Gateway ID.
                      password:
                        type: string
                        description: Government Gateway password.
                      userFullName:
                        type: string
                        description: Government Gateway user's full name.
                      emailAddress:
                        type: string
                        description: Government Gateway user's email address.
                      organisationDetails:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Organisation name.
                          address:
                            type: object
                            properties:
                              line1:
                                type: string
                                description: Organisation's first line of address.
                              line2:
                                type: string
                                description: Organisation's second line of address.
                              postcode:
                                type: string
                                description: Organisation's postcode.
                            required:
                              - line1
                              - line2
                              - postcode
                        required:
                          - name
                          - address
                      individualDetails:
                        type: object
                        properties:
                          firstName:
                            type: string
                            description: Individual's first name.
                          lastName:
                            type: string
                            description: Individual's last name.
                          dateOfBirth:
                            type: string
                            format: date
                            description: Individual's date of birth.
                          address:
                            type: object
                            properties:
                              line1:
                                type: string
                                description: Individual's first line of address.
                              line2:
                                type: string
                                description: Individual's second line of address.
                              postcode:
                                type: string
                                description: Individual's postcode.
                            required:
                              - line1
                              - line2
                              - postcode
                        required:
                          - firstName
                          - lastName
                          - dateOfBirth
                          - address
                      saUtr:
                        type: string
                        description: Self Assessment UTR.
                      nino:
                        type: string
                        description: National Insurance number.
                      mtdItId:
                        type: string
                        description: Making Tax Digital Income Tax ID.
                      empRef:
                        type: string
                        description: Employer Reference.
                      ctUtr:
                        type: string
                        description: Corporation Tax UTR.
                      vrn:
                        type: string
                        description: VAT Reference Number.
                      vatRegistrationDate:
                        type: string
                        format: date
                        description: Date of registration for VAT.
                      lisaManagerReferenceNumber:
                        type: string
                        description: LISA Manager Reference Number, in either 4-digit format (Znnnn) or 6-digit format (Znnnnnn).
                      secureElectronicTransferReferenceNumber:
                        type: string
                        description: Secure Electronic Transfer reference number.
                      pensionSchemeAdministratorIdentifier:
                        type: string
                        description: Pension Scheme Administrator Identifier.
                      eoriNumber:
                        type: string
                        description: Economic Operator Registration and Identification (EORI) number.
                      exciseNumber:
                        type: string
                        description: Excise Number.
                      crn:
                        type: string
                        description: Company Reference Number
                      taxPayerType:
                        type: string
                        description: Type of Self Assessment taxpayer One of 'Individual' or 'Partnership'
                      pillar2Id:
                        type: string
                        description: Pillar 2 ID
                      zReference:
                        type: string
                        description: ISA Manager Z Reference, in 4-digit format (Znnnn).
                    required:
                      - userId
                      - password
                      - userFullName
                      - emailAddress
                      - organisationDetails
      security:
        - applicationRestricted: []
      deprecated: false
  /create-test-user/agents:
    post:
      tags:
        - create-test-user
      summary: Create a test user which is an agent
      description: This resource creates and returns a test user which is an agent. The caller can specify the required service enrolments in the request body. If no request body is supplied, the test user is created with no service enrolments.  Test users that have not been tested against within a 3-month period will be automatically deleted.
      operationId: Createatestuserwhichisanagent
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
                - $schema: http://json-schema.org/draft-04/schema#
                  description: Create Agent Request
                  type: object
                  properties:
                    serviceNames:
                      type: array
                      description: A list of services that the user should be enrolled for. To create a test user with no services, leave the list empty.
                      minItems: 0
                      items:
                        type: string
                        oneOf:
                          - title: agent-services
                            enum:
                              - agent-services
                            description: Generates an agent services account reference number and enrols the user for agent services.
                      uniqueItems: true
                  required:
                    - serviceNames
      responses:
        '201':
          description: The agent test user resource has been created.
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $schema: http://json-schema.org/draft-04/schema#
                    description: Create Agent Response
                    type: object
                    properties:
                      userId:
                        type: string
                        description: Government Gateway ID.
                      password:
                        type: string
                        description: Government Gateway password.
                      userFullName:
                        type: string
                        description: Government Gateway user's full name.
                      emailAddress:
                        type: string
                        description: Government Gateway user's email address.
                      agentServicesAccountNumber:
                        type: string
                        description: Agent services account reference number.
                    required:
                      - userId
                      - password
                      - userFullName
                      - emailAddress
      security:
        - applicationRestricted: []
      deprecated: false
  /create-test-user/services:
    get:
      tags:
        - create-test-user
      summary: Get available services
      description: This resource provides a list of all the available services together with which test user types can enrol to each.
      operationId: Getavailableservices
      parameters: []
      responses:
        '200':
          description: The services available for enrolment
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                  - $schema: http://json-schema.org/draft-04/schema#
                    description: Get Services Response
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          description: The key of the service
                        name:
                          type: string
                          description: The human readable name of the service
                        allowedUserTypes:
                          type: array
                          description: The user types which may enrol to the service
                          items:
                            type: string
                            description: The user type
      security:
        - applicationRestricted: []
      deprecated: false
components:
  securitySchemes:
    applicationRestricted:
      type: oauth2
      description: |
        HMRC supports OAuth 2.0 for authenticating application restricted API requests using an OAuth 2.0 Bearer Token in the AUTHORIZATION header.
        See https://developer.service.hmrc.gov.uk/api-documentation/docs/authorisation/application-restricted-endpoints for details.
      flows:
        clientCredentials:
          tokenUrl: https://test-api.service.hmrc.gov.uk/oauth/token
          scopes: {}
